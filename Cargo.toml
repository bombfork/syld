[package]
name = "syld"
version = "0.7.0"
edition = "2024"
description = "Support Your Linux Desktop — discover and support the open source you use"
authors = ["bombfork"]
readme = "README.md"
homepage = "https://github.com/bombfork/syld"
license = "GPL-3.0-or-later"
repository = "https://github.com/bombfork/syld"
keywords = ["linux", "opensource", "donations", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.0"
directories = "6"
comfy-table = "7"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "rustls", "blocking"], default-features = false }
anyhow = "1"
rayon = "1"
indicatif = "0.18"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
dialoguer = "0.12"
rand = "0.10.0"

[dev-dependencies]
assert_cmd = "2.1.2"
jsonschema = "0.43"
predicates = "3.1.4"
tempfile = "3.26.0"
