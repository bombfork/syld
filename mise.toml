[tools]
rust = "stable"
"cargo:cargo-binstall" = "latest"
"cargo:cargo-edit" = "latest"
"cargo:cargo-llvm-cov" = "latest"
hk = "latest"
pkl = "latest"
"github:bombfork/releaser" = "latest"

[tasks.fmt]
description = "Format code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check code formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy and fix warnings"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks."lint:check"]
description = "Check for clippy warnings"
run = "cargo clippy -- -D warnings"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.coverage]
description = "Open HTML test coverage report"
run = "cargo llvm-cov --html --open"

[tasks."coverage:check"]
description = "Fail if test coverage drops below 75%"
run = "cargo llvm-cov --fail-under-lines 75"

[tasks."deps:update"]
description = "Update Rust dependencies"
run = "cargo upgrade --incompatible && cargo update"

[tasks.check]
description = "Run all checks (format, lint, build, test)"
depends = ["fmt:check", "lint:check", "build", "test"]

[tasks.release]
description = "Releases are automated via releaser (merge the releaser/pending-release PR)"
run = '''
echo "Releases are automated: merge the 'releaser/pending-release' PR on GitHub."
echo "Preview the next release locally with: releaser release --dry-run"
'''
